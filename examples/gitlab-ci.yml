# Every 5 minutes (pipeline schedule `*/5 * * * *`) on a runner outside the network of the mirrors;
# each run checks 1/12 of the hosts, so every host is checked once an hour. Keep site/ between
# runs (a volume, or the folder a web server serves): report.json is the state. Pin the commit of
# pkg-audit you reviewed instead of a branch.
audit:
  image: python:3.12-slim
  variables:
    PKG_AUDIT_COMMIT: "<commit sha>"
  script:
    - python3 -c "import urllib.request as u; u.urlretrieve('https://raw.githubusercontent.com/shecanir/pkg-audit/$PKG_AUDIT_COMMIT/pkg_audit.py', 'pkg_audit.py')"
    - mkdir -p site
    - python3 pkg_audit.py images.txt docker-mirrors.txt --packages packages.txt --targets targets.txt --brand brand.json --state site/report.json --slots 12 --slot-minutes 5 --json site/report.json --summary site/summary.json --html site/index.html
  artifacts:
    when: always
    paths: [site]
