name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile pkg_audit.py serve.py
      - run: python3 -m json.tool schema/summary-v1.schema.json > /dev/null
      - run: python3 tests/test_pkg_audit.py
      - run: python3 tests/test_serve.py
      - run: python3 tests/test_tunnel.py
